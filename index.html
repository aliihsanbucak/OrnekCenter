@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap');
.oc-root *{box-sizing:border-box;margin:0;padding:0}
.oc-root{
  --navy:#0c1322;--navy2:#111c33;--ink:#0f1729;--slate:#475569;--muted:#94a3b8;
  --line:#e6e9ef;--bg:#f3f5f8;--card:#fff;--gold:#c79212;--gold2:#e8b73e;
  --green:#15803d;--red:#dc2626;--blue:#2563eb;
  display:flex;min-height:100vh;background:var(--bg);color:var(--ink);
  font-family:'Inter',system-ui,sans-serif;font-size:14px;line-height:1.45;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;
}
.oc-root h3{font-family:'Sora','Inter',sans-serif}
/* sidebar */
.oc-side{width:248px;flex-shrink:0;background:linear-gradient(180deg,var(--navy),#0a101d);
  color:#cbd5e1;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;border-right:1px solid #0a0f1a}
.oc-brand{display:flex;gap:12px;align-items:center;padding:22px 20px 18px;border-bottom:1px solid rgba(255,255,255,.07)}
.oc-logo{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;font-family:'Sora';font-weight:800;
  color:#1a1303;background:linear-gradient(135deg,var(--gold2),var(--gold));font-size:15px;letter-spacing:.5px;
  box-shadow:0 4px 14px rgba(199,146,18,.35)}
.oc-brand-name{font-family:'Sora';font-weight:700;color:#fff;font-size:16px;letter-spacing:.2px}
.oc-brand-sub{font-size:10.5px;color:#7c8aa3;letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
.oc-nav{flex:1;padding:14px 12px;display:flex;flex-direction:column;gap:3px;overflow:auto}
.oc-navi{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:0;background:transparent;
  color:#aab6cc;border-radius:10px;cursor:pointer;font-size:13.5px;font-weight:500;font-family:inherit;
  text-align:left;transition:.15s;border-left:3px solid transparent}
.oc-navi:hover{background:rgba(255,255,255,.05);color:#e9eef7}
