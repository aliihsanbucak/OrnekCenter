@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap');
.oc-root *{box-sizing:border-box;margin:0;padding:0}
.oc-root{
  --navy:#0c1322;--navy2:#111c33;--ink:#0f1729;--slate:#475569;--muted:#94a3b8;
  --line:#e6e9ef;--bg:#f3f5f8;--card:#fff;--gold:#c79212;--gold2:#e8b73e;
  --green:#15803d;--red:#dc2626;--blue:#2563eb;
  display:flex;min-height:100vh;background:var(--bg);color:var(--ink);
  font-family:'Inter',system-ui,sans-serif;font-size:14px;line-height:1.45;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;
}
.oc-root h3{font-family:'Sora','Inter',sans-serif}
/* sidebar */
.oc-side{width:248px;flex-shrink:0;background:linear-gradient(180deg,var(--navy),#0a101d);
  color:#cbd5e1;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;border-right:1px solid #0a0f1a}
.oc-brand{display:flex;gap:12px;align-items:center;padding:22px 20px 18px;border-bottom:1px solid rgba(255,255,255,.07)}
.oc-logo{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;font-family:'Sora';font-weight:800;
  color:#1a1303;background:linear-gradient(135deg,var(--gold2),var(--gold));font-size:15px;letter-spacing:.5px;
  box-shadow:0 4px 14px rgba(199,146,18,.35)}
.oc-brand-name{font-family:'Sora';font-weight:700;color:#fff;font-size:16px;letter-spacing:.2px}
.oc-brand-sub{font-size:10.5px;color:#7c8aa3;letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
.oc-nav{flex:1;padding:14px 12px;display:flex;flex-direction:column;gap:3px;overflow:auto}
.oc-navi{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:0;background:transparent;
  color:#aab6cc;border-radius:10px;cursor:pointer;font-size:13.5px;font-weight:500;font-family:inherit;
  text-align:left;transition:.15s;border-left:3px solid transparent}
.oc-navi:hover{background:rgba(255,255,255,.05);color:#e9eef7}
.oc-navi.on{background:rgba(199,146,18,.13);color:#fff;border-left-color:var(--gold2)}
.oc-navi-ic{width:18px;height:18px;flex-shrink:0;opacity:.92}
.oc-side-foot{display:flex;align-items:center;gap:11px;padding:14px 18px;border-top:1px solid rgba(255,255,255,.07)}
.oc-user-av{width:36px;height:36px;border-radius:50%;background:#1c2942;color:#dbe4f3;display:grid;place-items:center;font-weight:700;font-size:13px}
.oc-user-name{color:#e9eef7;font-weight:600;font-size:13px}
.oc-user-role{color:#7c8aa3;font-size:11px}
/* main */
.oc-main{flex:1;display:flex;flex-direction:column;min-width:0}
.oc-top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:0 26px;height:62px;
  background:rgba(255,255,255,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.oc-burger{display:none;font-size:22px;background:none;border:0;cursor:pointer;color:var(--ink)}
.oc-top-title{font-family:'Sora';font-weight:700;font-size:18px;flex:1}
.oc-period{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.oc-top-right{display:flex;align-items:center;gap:14px}
.oc-today{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:9px;padding:7px 12px;font-variant-numeric:tabular-nums}
.oc-today-dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(21,128,61,.15)}
.oc-period span{text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.oc-period select,.oc-root select,.oc-root input{font-family:inherit;font-size:13.5px;color:var(--ink)}
.oc-period select{padding:7px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;font-weight:600;cursor:pointer}
.oc-content{padding:24px 26px 90px;flex:1}
.oc-stack{display:flex;flex-direction:column;gap:18px}
/* status bar */
.oc-status{position:sticky;bottom:0;z-index:15;display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);
  border-top:1px solid var(--line)}
.oc-st{background:#fff;padding:10px 22px;display:flex;flex-direction:column}
.oc-st-l{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.oc-st-v{font-family:'Sora';font-weight:700;font-size:17px;margin-top:1px}
.oc-st-v.ink{color:var(--ink)}.oc-st-v.green{color:var(--green)}.oc-st-v.red{color:var(--red)}.oc-st-v.gold{color:var(--gold)}
/* kpi */
.oc-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.oc-kpis.three{grid-template-columns:repeat(3,1fr)}
.oc-kpi{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:17px 18px;position:relative;overflow:hidden;
  box-shadow:0 1px 2px rgba(15,23,41,.04)}
.oc-kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px}
.oc-kpi.blue:before{background:var(--blue)}.oc-kpi.green:before{background:var(--green)}
.oc-kpi.red:before{background:var(--red)}.oc-kpi.gold:before{background:var(--gold)}
.oc-kpi-eb{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.oc-kpi-v{font-family:'Sora';font-weight:800;font-size:25px;margin:7px 0 6px;letter-spacing:-.5px}
.oc-kpi-b{display:flex;gap:8px;align-items:center;font-size:11.5px;color:var(--slate);flex-wrap:wrap}
.oc-kpi-delta{font-weight:700;padding:2px 6px;border-radius:6px;font-size:11px}
.oc-kpi-delta.up{color:var(--green);background:#e7f3ec}.oc-kpi-delta.dn{color:var(--red);background:#fbeaea}
/* equity hero */
.oc-equity{display:grid;grid-template-columns:300px 1fr;gap:0;background:linear-gradient(120deg,var(--navy),#15233e);
  border-radius:16px;overflow:hidden;color:#e9eef7;box-shadow:0 10px 30px rgba(12,19,34,.18)}
.oc-equity-head{padding:24px 26px;display:flex;flex-direction:column;justify-content:center;border-right:1px solid rgba(255,255,255,.08)}
.oc-eyebrow{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;font-weight:700;color:#8aa0c4}
.oc-eyebrow.gold{color:var(--gold2)}
.oc-equity-big{font-family:'Sora';font-weight:800;font-size:38px;margin:8px 0 6px;color:#fff;letter-spacing:-1px}
.oc-equity-note{font-size:11.5px;color:#9fb0cb;line-height:1.5}
.oc-equity-rows{padding:22px 26px;display:flex;flex-direction:column;gap:14px;justify-content:center}
.oc-equity-row{display:grid;grid-template-columns:1fr 130px 110px;align-items:center;gap:14px}
.oc-er-name{font-size:13.5px;font-weight:600;color:#e9eef7;display:flex;flex-direction:column;gap:3px}
.oc-tagmini{font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:#8aa0c4;font-weight:600}
.oc-er-bar{height:7px;background:rgba(255,255,255,.1);border-radius:5px;overflow:hidden}
.oc-er-bar div{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:5px}
.oc-er-val{text-align:right;font-family:'Sora';font-weight:700;font-size:15px;color:#cdd8ea}
.oc-er-val.pos{color:var(--gold2)}
/* card */
.oc-card{background:var(--card);border:1px solid var(--line);border-radius:15px;box-shadow:0 1px 2px rgba(15,23,41,.04)}
.oc-card-h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start}
.oc-card-h h3{font-size:15.5px;font-weight:700;letter-spacing:-.2px}
.oc-card-h p{font-size:11.5px;color:var(--muted);margin-top:2px}
.oc-card-b{padding:18px 20px}
.oc-grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
/* form */
.oc-form{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end}
.oc-form.col{flex-direction:column;align-items:stretch}
.oc-2col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.oc-field{display:flex;flex-direction:column;gap:6px;min-width:140px;flex:1}
.oc-field span{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--slate);font-weight:600}
.oc-field input,.oc-field select{padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#fcfcfd;outline:none;transition:.15s;width:100%}
.oc-field input:focus,.oc-field select:focus{border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.oc-form-note{font-size:11.5px;color:var(--muted);margin-top:11px}
/* buttons */
.oc-btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:9px;border:1px solid var(--line);
  background:#fff;color:var(--ink);font-weight:600;font-size:13px;cursor:pointer;font-family:inherit;transition:.15s;white-space:nowrap}
.oc-btn:hover{background:#f8fafc}
.oc-btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.oc-btn.primary:hover{background:#1c2942}
.oc-btn.primary:disabled{opacity:.4;cursor:not-allowed}
.oc-btn.danger{color:var(--red);border-color:#f3c9c9;background:#fdf2f2}
.oc-btn-ic{width:15px;height:15px}
.oc-x{padding:5px 11px;font-size:12px;border:1px solid var(--line);border-radius:7px;background:#fff;cursor:pointer;
  color:var(--slate);font-weight:600;font-family:inherit;transition:.15s}
.oc-x:hover{background:#f1f5f9}
.oc-x.ok{color:var(--green);border-color:#bfe6cd}.oc-x.ok:hover{background:#e7f3ec}
.oc-x.warn{color:#b45309;border-color:#f4d9a8}.oc-x.warn:hover{background:#fef3e2}
/* table */
.oc-table-wrap{overflow-x:auto;margin:-4px}
.oc-table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
.oc-table th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
  font-weight:700;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.oc-table td{padding:11px 12px;border-bottom:1px solid #f1f3f7;vertical-align:middle}
.oc-table tr:last-child td{border-bottom:0}
.oc-table tr.cx td{opacity:.45;text-decoration:line-through}
.oc-table .ta-r{text-align:right}
.oc-table .muted{color:var(--muted)}
.oc-table .neg{color:var(--red)}.oc-table .pos{color:var(--green)}
.gold-t{color:var(--gold)}
.oc-cxtag{font-size:11px;color:var(--red);font-weight:600}
/* pills */
.oc-pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.oc-pill.ok{background:#e7f3ec;color:var(--green)}.oc-pill.warn{background:#fef3e2;color:#b45309}
.oc-pill.blue{background:#e8f0fe;color:var(--blue)}.oc-pill.red{background:#fbeaea;color:var(--red)}
.oc-pill.purple{background:#f3e8fd;color:#9333ea}.oc-pill.gold{background:#fbf0d4;color:#9a7212}
.oc-tagmini{display:inline-block;margin-left:7px;font-size:9.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.oc-tagmini.gold{color:var(--gold);background:#fbf0d4;padding:2px 6px;border-radius:5px}
/* pie legend */
.oc-pie-wrap{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.oc-legend{display:flex;flex-direction:column;gap:8px;min-width:150px;flex:1}
.oc-leg{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--slate)}
.oc-leg i{width:11px;height:11px;border-radius:3px;flex-shrink:0}
.oc-leg b{margin-left:auto;color:var(--ink);font-family:'Sora';font-weight:600}
/* mini list */
.oc-mini-list{display:flex;flex-direction:column;gap:2px}
.oc-ml-row{display:flex;justify-content:space-between;align-items:center;padding:11px 4px;border-bottom:1px solid #f1f3f7}
.oc-ml-row:last-child{border:0}
.oc-ml-t{font-weight:600;font-size:13.5px}.oc-ml-s{font-size:11px;color:var(--muted)}
.oc-ml-right{text-align:right}.oc-ml-amt{font-family:'Sora';font-weight:700;font-size:14px}
.oc-ml-due{font-size:10.5px;color:var(--muted);font-weight:600}.oc-ml-due.od{color:var(--red)}
/* partner cards */
.oc-partner-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.oc-partner-card{border:1px solid var(--line);border-radius:13px;padding:16px;background:linear-gradient(180deg,#fff,#fafbfd)}
.oc-pc-top{display:flex;gap:11px;align-items:center;margin-bottom:14px}
.oc-pc-av{width:40px;height:40px;border-radius:11px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700;font-family:'Sora';font-size:14px}
.oc-pc-name{font-weight:700;font-size:14.5px}.oc-pc-sub{font-size:11px;color:var(--muted)}
.oc-pc-stats{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:13px}
.oc-pc-stats>div{display:flex;justify-content:space-between;font-size:12.5px}
.oc-pc-stats span{color:var(--muted)}.oc-pc-stats b{font-family:'Sora';font-weight:700}
.oc-pc-actions{display:flex;gap:7px}.oc-pc-actions .oc-x{flex:1;text-align:center;padding:7px 4px}
/* row actions */
.oc-row-actions{display:flex;align-items:center;gap:16px;margin-top:14px;flex-wrap:wrap}
/* P&L */
.oc-pl{display:flex;flex-direction:column}
.oc-pl-row{display:flex;justify-content:space-between;padding:13px 6px;border-bottom:1px solid #f1f3f7;font-size:14px}
.oc-pl-row b{font-family:'Sora';font-weight:700}
.oc-pl-row.pos b{color:var(--ink)}.oc-pl-row.neg b{color:var(--red)}
.oc-pl-row.b{font-weight:700;background:#f8fafc}.oc-pl-row.b span{font-weight:700}
.oc-pl-row.big{background:var(--ink);color:#fff;border-radius:11px;margin-top:8px;padding:16px;font-size:16px}
.oc-pl-row.big.pos b{color:#5fd089}.oc-pl-row.big.neg b{color:#ff8585}
.oc-pl-row.big span{font-weight:700;letter-spacing:.02em}
/* sum list */
.oc-sumlist,.oc-export{display:flex;flex-direction:column;gap:0}
.oc-sum-row{display:flex;justify-content:space-between;padding:11px 4px;border-bottom:1px solid #f1f3f7;font-size:13.5px}
.oc-sum-row span{color:var(--slate)}.oc-sum-row b{font-family:'Sora';font-weight:700}
.oc-export{flex-direction:row;gap:12px;flex-wrap:wrap}
/* audit */
.oc-audit{display:flex;flex-direction:column;gap:0;max-height:340px;overflow:auto}
.oc-audit-row{display:grid;grid-template-columns:130px 110px 1fr;gap:10px;padding:8px 4px;border-bottom:1px solid #f1f3f7;font-size:12px;align-items:center}
.oc-audit-ts{color:var(--muted);font-variant-numeric:tabular-nums}
.oc-audit-u{color:var(--slate);font-weight:600}
/* inline edit */
.oc-inline{padding:6px 9px;border:1px solid var(--line);border-radius:7px;background:#fcfcfd;width:100%}
.oc-inline.w70{width:70px}.oc-inline.w110{width:110px}
.oc-inline:disabled{opacity:.4}
/* empty */
.oc-empty{text-align:center;color:var(--muted);padding:26px;font-size:13px}
/* filter bar */
.oc-filterbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.oc-filter-in{padding:8px 11px;border:1px solid var(--line);border-radius:9px;background:#fcfcfd;font-size:13px;min-width:170px;font-family:inherit;color:var(--ink)}
.oc-filter-in:focus{outline:none;border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.oc-check{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--slate);font-weight:600;cursor:pointer}
.oc-check input{width:15px;height:15px}
/* gider kalemi y\xF6netimi */
.oc-expcat{margin-bottom:16px}
.oc-expcat-h{font-size:12px;font-weight:700;color:var(--slate);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.oc-chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:9px}
.oc-chip{display:inline-flex;align-items:center;gap:6px;background:#eef1f6;border:1px solid var(--line);border-radius:20px;padding:5px 6px 5px 12px;font-size:12.5px;font-weight:600;color:var(--ink)}
.oc-chip button{width:18px;height:18px;border:0;border-radius:50%;background:#d7dce4;color:#334155;cursor:pointer;font-size:13px;line-height:1;display:grid;place-items:center;font-family:inherit}
.oc-chip button:hover{background:var(--red);color:#fff}
.oc-chip-empty{font-size:12px;color:var(--muted)}
.oc-expcat-add{display:flex;gap:8px;align-items:center}
/* tedarik\xE7i haftal\u0131k ziyaret program\u0131 */
.oc-weektabs{display:flex;gap:6px}
.oc-weektabs .oc-x.act{background:var(--navy);color:#fff;border-color:var(--navy)}
.oc-week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin:4px 0 6px}
.oc-weekday{border:1px solid var(--line);border-radius:11px;background:#fafbfd;min-height:96px;overflow:hidden;display:flex;flex-direction:column}
.oc-weekday.today{border-color:var(--gold);box-shadow:0 0 0 2px rgba(232,183,62,.25)}
.oc-weekday-h{display:flex;justify-content:space-between;align-items:center;padding:7px 9px;background:var(--navy);color:#fff}
.oc-weekday.today .oc-weekday-h{background:linear-gradient(90deg,var(--navy),#1a2744)}
.oc-weekday-h span{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;opacity:.85}
.oc-weekday-h b{font-family:'Sora';font-size:12.5px;color:var(--gold)}
.oc-weekday-list{display:flex;flex-direction:column;gap:5px;padding:8px}
.oc-visit{font-size:11.5px;font-weight:600;color:var(--ink);background:#eef1f6;border:1px solid var(--line);border-radius:7px;padding:4px 7px;line-height:1.25}
.oc-visit-none{color:var(--muted);font-size:12px;text-align:center;padding:6px 0}
.oc-visit-editor{display:flex;flex-direction:column;gap:9px}
.oc-visit-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line)}
.oc-visit-row:last-child{border-bottom:0}
.oc-visit-name{font-weight:700;font-size:13.5px;color:var(--ink)}
.oc-daychips{display:flex;gap:5px;flex-wrap:wrap}
.oc-daychip{width:40px;height:32px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--muted);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:.12s}
.oc-daychip:hover{border-color:var(--navy);color:var(--ink)}
.oc-daychip.on{background:var(--gold);border-color:var(--gold);color:var(--navy)}
@media(max-width:820px){.oc-week{grid-template-columns:repeat(2,1fr)}}
/* g\xFCnl\xFCk nakit ak\u0131\u015F\u0131 */
.oc-cashflow{display:flex;flex-direction:column;gap:2px;margin-bottom:4px}
.oc-cf-row{display:flex;justify-content:space-between;align-items:center;padding:8px 2px;font-size:13.5px;border-bottom:1px solid var(--line)}
.oc-cf-row span{color:var(--muted)}
.oc-cf-row b{font-family:'Sora';font-weight:700}
.oc-cf-row.neg b{color:var(--red)}
.oc-cf-row.total{border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);margin:2px 0;padding:10px 2px}

.oc-cf-row.total.gold{border-color:var(--gold)}
.oc-cf-row.total.gold b.pos{color:#15803d}
.oc-cf-row b.pos{color:#15803d}
.oc-cf-row b.neg{color:var(--red)}
/* personel ekleme sat\u0131r\u0131 */
.oc-empadd{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.oc-filter-in.w120{min-width:0;width:120px}
.oc-rowbtns{display:flex;gap:6px;justify-content:flex-end}
/* toast */
.oc-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:100;padding:12px 22px;border-radius:11px;
  font-size:13.5px;font-weight:600;color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.2);animation:ocpop .25s}
.oc-toast.ok{background:var(--green)}.oc-toast.warn{background:#b45309}
@keyframes ocpop{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
.oc-scrim{display:none}
/* modal */
.oc-modal-scrim{position:fixed;inset:0;z-index:90;background:rgba(8,12,20,.55);display:grid;place-items:center;padding:20px;animation:ocfade .15s}
.oc-modal{width:100%;max-width:420px;background:#fff;border-radius:15px;box-shadow:0 24px 60px rgba(8,12,20,.35);overflow:hidden;animation:ocpop .2s}
.oc-modal-h{padding:16px 20px;font-family:'Sora';font-weight:700;font-size:16px;border-bottom:1px solid var(--line)}
.oc-modal-b{padding:18px 20px}
.oc-modal-b .oc-field input{padding:11px 12px;font-size:15px}
.oc-modal-f{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--line);background:#fafbfd}
@keyframes ocfade{from{opacity:0}to{opacity:1}}
/* partner ledger */
.oc-pc-ledger{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:5px}
.oc-pcl-row{display:flex;justify-content:space-between;font-size:11.5px;color:var(--slate)}
.oc-pcl-row b{font-family:'Sora';font-weight:600}
.oc-pcl-row b.pos{color:var(--green)}.oc-pcl-row b.neg{color:var(--red)}
.oc-pcl-empty{font-size:11.5px;color:var(--muted);text-align:center;padding:4px}
/* responsive */
@media(max-width:1080px){.oc-kpis{grid-template-columns:repeat(2,1fr)}.oc-kpis.three{grid-template-columns:1fr}.oc-grid2{grid-template-columns:1fr}.oc-equity{grid-template-columns:1fr}.oc-equity-head{border-right:0;border-bottom:1px solid rgba(255,255,255,.08)}.oc-partner-grid{grid-template-columns:1fr}}
@media(max-width:760px){
  .oc-side{position:fixed;left:0;top:0;z-index:60;transform:translateX(-100%);transition:transform .25s;box-shadow:0 0 40px rgba(0,0,0,.3)}
  .oc-side.open{transform:translateX(0)}
  .oc-scrim{display:block;position:fixed;inset:0;background:rgba(8,12,20,.5);z-index:55}
  .oc-burger{display:block}
  .oc-content{padding:18px 16px 96px}.oc-top{padding:0 16px}
  .oc-status{grid-template-columns:repeat(2,1fr)}
  .oc-today{display:none}
  .oc-kpis{grid-template-columns:1fr}.oc-st{padding:9px 16px}.oc-st-v{font-size:15px}
  .oc-form{gap:11px}.oc-field{min-width:120px}
}
